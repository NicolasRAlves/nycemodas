<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Use Nyce Modas • Links</title>
    <meta name="description" content="Use Nyce Modas — slim ao plus size. Para mulheres que não passam despercebidas. Chame no WhatsApp e enviamos para todo o Brasil." />
    <meta name="theme-color" content="#f5efe9" />
    <meta property="og:title" content="Use Nyce Modas" />
    <meta property="og:description" content="Para mulheres que não passam despercebidas. Slim ao plus size." />
    <meta property="og:image" content="capa-nyce.jpg" />
    <link rel="icon" href="capa-nyce.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

    <style>
        /* =========================================================
           🎨 CORES — troque aqui
           ========================================================= */
        :root {
            --cream: #f5efe9;      /* fundo */
            --paper: #fffdfb;      /* cartões */
            --ink: #1d1a18;        /* texto e botão principal */
            --ink-soft: rgba(29, 26, 24, .62);
            --gold: #b08a57;       /* dourado (detalhes, como as bijuterias das fotos) */
            --gold-soft: #d9c3a0;
            --line: rgba(176, 138, 87, .35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Jost', system-ui, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(120% 60% at 50% 0%, #fffdfb 0%, var(--cream) 60%, #ebe1d6 100%) fixed, var(--cream);
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }
        [hidden] { display: none !important; }

        main {
            max-width: 440px;
            margin: 0 auto;
            padding: calc(28px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
        }

        .reveal { opacity: 0; transform: translateY(22px); animation: up .9s cubic-bezier(.16, 1, .3, 1) forwards; }
        @keyframes up { to { opacity: 1; transform: none; } }

        /* ---------- topo ---------- */
        .hero { text-align: center; }

        .avatar {
            width: 156px;
            height: 192px;
            margin: 0 auto;
            border-radius: 96px 96px 24px 24px;
            overflow: hidden;
            border: 1px solid var(--gold-soft);
            box-shadow: 0 0 0 6px rgba(255, 255, 255, .7), 0 24px 40px -22px rgba(29, 26, 24, .45);
            background: #e9e1d7;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }

        .name {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 46px;
            line-height: 1;
            letter-spacing: -.01em;
            margin-top: 22px;
        }

        .logo-brand {
            display: block;
            width: 210px;
            max-width: 70%;
            height: auto;
            margin: 22px auto 0;
            filter: drop-shadow(0 4px 12px rgba(176, 138, 87, .25));
        }

        .tag {
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .tag i { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); display: inline-block; }

        .bio {
            margin: 12px auto 0;
            max-width: 300px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 21px;
            line-height: 1.3;
            color: var(--ink-soft);
        }

        /* ---------- botões ---------- */
        .cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 58px;
            margin-top: 24px;
            border-radius: 18px;
            background: var(--ink);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: .02em;
            box-shadow: 0 18px 30px -16px rgba(29, 26, 24, .6);
            transition: transform .25s, background .25s;
        }

        .cta:hover { background: #2c2724; }

        .duo { display: grid; gap: 10px; margin-top: 10px; }

        .ghost {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 52px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: var(--paper);
            font-weight: 500;
            font-size: 13.5px;
            padding: 0 6px;
            white-space: nowrap;
            transition: transform .25s, background .25s;
        }

        .ghost:hover { background: #fff; }

        .cta:active, .ghost:active, .pbtn:active { transform: scale(.97); }

        .cta svg, .ghost svg, .pbtn svg { width: 19px; height: 19px; flex: none; }
        .ghost svg { color: var(--gold); }

        /* ---------- peças (vitrine) ---------- */
        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 30px;
            margin: 30px 2px 12px;
        }

        .vitrine { position: relative; margin: 0 -18px; }

        .track {
            position: relative;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            padding: 4px 18px 6px;
        }

        .track::-webkit-scrollbar { display: none; }

        .slide {
            position: relative;
            flex: 0 0 82%;
            aspect-ratio: 3 / 4;
            border-radius: 26px;
            overflow: hidden;
            scroll-snap-align: center;
            background: #e9e1d7;
            box-shadow: 0 22px 40px -24px rgba(29, 26, 24, .55);
        }

        .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .slide .shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(20, 16, 15, 0) 42%, rgba(20, 16, 15, .6) 68%, rgba(20, 16, 15, .94) 100%);
        }

        .slide .info { position: absolute; left: 18px; right: 18px; bottom: 18px; color: #fff; }

        .slide .sub {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: #e9d3ae;
        }

        .slide h3 {
            margin-top: 4px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 30px;
            line-height: 1.05;
            text-shadow: 0 2px 14px rgba(0, 0, 0, .35);
        }

        .pbtn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 46px;
            margin-top: 12px;
            border-radius: 16px;
            background: #fff;
            color: var(--ink);
            font-weight: 600;
            font-size: 14px;
            transition: transform .25s, background .25s;
        }

        .pbtn:hover { background: #f3ece4; }

        .dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }

        .dot {
            width: 6px;
            height: 6px;
            border: 0;
            border-radius: 99px;
            background: rgba(29, 26, 24, .22);
            transition: width .3s, background .3s;
            cursor: pointer;
        }

        .dot.on { width: 20px; background: var(--gold); }

        /* ---------- feedbacks (prints) ---------- */
        .fb-track {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            margin: 0 -18px;
            padding: 4px 18px 6px;
        }

        .fb-track::-webkit-scrollbar { display: none; }

        .fb-track img {
            flex: 0 0 72%;
            width: 72%;
            height: auto;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: var(--paper);
            scroll-snap-align: start;
            box-shadow: 0 16px 30px -22px rgba(29, 26, 24, .45);
        }

        /* ---------- informações ---------- */
        .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; }

        .fact {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 16px 14px;
        }

        .fact small {
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .fact b {
            display: block;
            margin-top: 6px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-weight: 600;
            line-height: 1.15;
        }

        .fact span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-soft); }

        footer { margin-top: 36px; text-align: center; }

        footer .sig {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 24px;
            color: var(--gold);
        }

        footer p {
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: rgba(29, 26, 24, .45);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .reveal { opacity: 1; transform: none; }
        }
    </style>
</head>

<body>
    <main>
        <section class="hero">
            <div class="avatar reveal" style="animation-delay:.08s">
                <img id="foto" alt="" onerror="this.parentNode.style.display='none'" />
            </div>
            <h1 class="reveal" style="animation-delay:.16s">
                <img class="logo-brand" src="logo-use-nyce.png" alt="Use Nyce Modas — Moda Feminina" />
            </h1>
            <div class="tag reveal" id="tag" style="animation-delay:.22s"></div>
            <p class="bio reveal" id="bio" style="animation-delay:.28s"></p>

            <a class="cta reveal" id="cta" target="_blank" rel="noopener" style="animation-delay:.36s"></a>
            <div class="duo reveal" id="duo" style="animation-delay:.42s">
                <a class="ghost" id="btnVer" href="#produtos"></a>
                <a class="ghost" id="btnIg" target="_blank" rel="noopener"></a>
                <a class="ghost" id="btnTt" target="_blank" rel="noopener" hidden></a>
            </div>
        </section>

        <section id="produtos">
            <h2 class="section-title reveal" style="animation-delay:.5s">Peças em destaque</h2>
            <div class="vitrine reveal" style="animation-delay:.56s">
                <div class="track" id="track"></div>
                <div class="dots" id="dots"></div>
            </div>
        </section>

        <section id="feedbacks" class="reveal" style="animation-delay:.6s" hidden>
            <h2 class="section-title">O que dizem</h2>
            <div class="fb-track" id="fb"></div>
        </section>

        <section class="facts reveal" id="facts" style="animation-delay:.66s"></section>

        <footer class="reveal" style="animation-delay:.72s">
            <div class="sig" id="sig"></div>
            <p id="copy"></p>
        </footer>
    </main>

    <script>
        /* =========================================================
           ✏️ CONFIGURAÇÃO — edite só este bloco
           Fotos ficam na mesma pasta do index.html (nome exato, com maiúsculas).
           Cada foto de "fotos" vira um slide da vitrine.
           ========================================================= */
        const LOJA = {
            nome: "Use Nyce Modas",
            tag: "Slim ao plus size",
            bio: "Para mulheres que não passam despercebidas.",
            foto: "capa-nyce.jpg",
            instagram: "usenyce_modas",               // @ da loja (sem o @)
            tiktok: "",                               // @ do TikTok (sem o @). Vazio = botão não aparece
            whatsapp: "5511982182633",                // DDI + DDD + número, só dígitos
            mensagem: "Oi! Vim pelo link da Use Nyce Modas e gostaria de tirar umas dúvidas.",
            atendimento: { titulo: "Segunda a sábado", texto: "das 10h às 19h" },
            envio: { titulo: "Enviamos", texto: "para todo o Brasil" },
            intervaloSeg: 4,                          // tempo entre um slide e outro da vitrine
            produtos: [
                {
                    nome: "Calça Jeans Modeladora",
                    sub: "",                           // texto pequeno acima do nome (opcional)
                    fotos: ["calca-1.jpg", "calca-2.jpg"],
                    mensagem: "Oi! Vi a Calça Jeans Modeladora no link da Use Nyce Modas e quero saber mais. Tem disponibilidade?",
                },
                {
                    nome: "Vestido Gabi",
                    sub: "Tricot Modal",
                    fotos: ["vestido-1.jpg", "vestido-2.jpg"],
                    mensagem: "Oi! Vi o Vestido Gabi (Tricot Modal) no link da Use Nyce Modas e quero saber mais. Tem disponibilidade?",
                },
                {
                    nome: "Corselet Lumière",
                    sub: "",
                    fotos: ["corselet-1.jpg"],
                    mensagem: "Oi! Vi o Corselet Lumière no link da Use Nyce Modas e quero saber mais. Tem disponibilidade?",
                },
            ],
            // Prints de feedback (nomes dos arquivos na pasta). Vazio = seção some.
            feedbacks: [],
        };
        /* ========================================================= */

        const ICON = {
            wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>',
            ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
            tt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6 0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64 0 3.33 2.76 5.7 5.69 5.7 3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48z"/></svg>',
            down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
        };
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const wa = (msg) => `https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(msg)}`;
        const igUrl = `https://www.instagram.com/${LOJA.instagram}`;

        // Topo
        document.title = `${LOJA.nome} • Links`;
        const foto = document.getElementById("foto"); foto.alt = LOJA.nome; foto.src = LOJA.foto;
        document.getElementById("tag").innerHTML = `<i></i><span>${esc(LOJA.tag)}</span><i></i>`;
        document.getElementById("bio").textContent = LOJA.bio;

        const cta = document.getElementById("cta");
        cta.href = wa(LOJA.mensagem);
        cta.innerHTML = `${ICON.wa}<span>Chamar no WhatsApp</span>`;

        const btnVer = document.getElementById("btnVer");
        btnVer.innerHTML = `${ICON.down}<span>Ver produtos</span>`;

        const btnIg = document.getElementById("btnIg");
        btnIg.href = igUrl;
        btnIg.innerHTML = `${ICON.ig}<span>Instagram</span>`;

        const btnTt = document.getElementById("btnTt");
        if (LOJA.tiktok) {
            btnTt.href = `https://www.tiktok.com/@${LOJA.tiktok}`;
            btnTt.innerHTML = `${ICON.tt}<span>TikTok</span>`;
            btnTt.hidden = false;
        }
        const visiveis = [btnVer, btnIg, btnTt].filter((b) => !b.hidden).length;
        document.getElementById("duo").style.gridTemplateColumns = `repeat(${visiveis}, 1fr)`;

        // Vitrine: uma slide por foto de cada peça
        const slides = LOJA.produtos.flatMap((p) => p.fotos.map((f) => ({ ...p, foto: f })));
        const track = document.getElementById("track");
        track.innerHTML = slides.map((s) => `
      <article class="slide">
        <img src="${esc(s.foto)}" alt="${esc(s.nome)}" loading="lazy" onerror="this.remove()">
        <div class="shade"></div>
        <div class="info">
          ${s.sub ? `<div class="sub">${esc(s.sub)}</div>` : ""}
          <h3>${esc(s.nome)}</h3>
          <a class="pbtn" href="${wa(s.mensagem)}" target="_blank" rel="noopener">${ICON.wa}<span>Quero esta peça</span></a>
        </div>
      </article>`).join("");

        // Bolinhas + movimento automático
        const dotsEl = document.getElementById("dots");
        const total = slides.length;
        let atual = 0, pausado = false, timer = null, ajuste = null;

        if (total > 1) {
            dotsEl.innerHTML = slides.map((_, i) => `<button class="dot" aria-label="Peça ${i + 1}"></button>`).join("");
            dotsEl.querySelectorAll(".dot").forEach((d, i) => d.addEventListener("click", () => { irPara(i); reiniciar(); }));
        } else {
            dotsEl.hidden = true;
        }

        const marcarDot = () => dotsEl.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("on", i === atual));

        function irPara(i) {
            atual = (i + total) % total;
            const s = track.children[atual];
            track.scrollTo({ left: s.offsetLeft - (track.clientWidth - s.offsetWidth) / 2, behavior: "smooth" });
            marcarDot();
        }

        function reiniciar() {
            clearInterval(timer);
            if (total > 1) timer = setInterval(() => { if (!pausado) irPara(atual + 1); }, LOJA.intervaloSeg * 1000);
        }

        // Atualiza o indicador quando o usuário desliza com o dedo
        track.addEventListener("scroll", () => {
            clearTimeout(ajuste);
            ajuste = setTimeout(() => {
                const centro = track.scrollLeft + track.clientWidth / 2;
                let melhor = 0, dist = Infinity;
                [...track.children].forEach((s, i) => {
                    const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - centro);
                    if (d < dist) { dist = d; melhor = i; }
                });
                atual = melhor;
                marcarDot();
            }, 120);
        });

        // Pausa enquanto o usuário toca/arrasta
        const pausar = () => { pausado = true; };
        const retomar = () => { setTimeout(() => { pausado = false; }, 2500); };
        track.addEventListener("pointerdown", pausar);
        track.addEventListener("pointerup", retomar);
        track.addEventListener("pointerleave", retomar);
        track.addEventListener("touchstart", pausar, { passive: true });
        track.addEventListener("touchend", retomar);

        marcarDot();
        reiniciar();

        // Feedbacks (prints)
        if (LOJA.feedbacks.length) {
            document.getElementById("fb").innerHTML = LOJA.feedbacks.map((f, i) =>
                `<img src="${esc(f)}" alt="Feedback ${i + 1}" loading="lazy" onerror="this.remove()">`).join("");
            document.getElementById("feedbacks").hidden = false;
        }

        // Informações
        document.getElementById("facts").innerHTML = `
      <div class="fact"><small>Atendimento</small><b>${esc(LOJA.atendimento.titulo)}</b><span>${esc(LOJA.atendimento.texto)}</span></div>
      <div class="fact"><small>Envios</small><b>${esc(LOJA.envio.titulo)}</b><span>${esc(LOJA.envio.texto)}</span></div>`;

        // Rodapé
        document.getElementById("sig").textContent = LOJA.nome;
        document.getElementById("copy").textContent = `@${LOJA.instagram} · © ${new Date().getFullYear()}`;
    </script>
</body>

</html>
